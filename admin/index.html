<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Report Me Moderation</title>
<link rel="icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Moderation and authority dashboard. Layout: header, then three columns on wide screens
   (views | list | detail); on phones the detail replaces the list and the views become a scrolling tab row. */
:root {
  --bg: #fffaf6; --surface: #ffffff; --sunken: #fbf3ec; --fg: #22180f; --muted: #6b5d52; --line: #f0e3d8;
  --brand: #e8590c; --brand-deep: #b83c0c; --brand-soft: #fde8db; --on-brand: #ffffff;
  --ok: #1f7a3d; --ok-soft: #dff3e6; --warn: #9a5b00; --warn-soft: #fdf0d5; --bad: #b42318; --bad-soft: #fde4e1;
  --info: #1d5fa8; --info-soft: #e1edfb;
  --font: "Readex Pro", system-ui, -apple-system, "Segoe UI", "Geeza Pro", sans-serif;
  --radius: 14px; --shadow: 0 10px 30px -18px rgba(120, 50, 10, .35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120f; --surface: #211a16; --sunken: #1b1512; --fg: #f6ede6; --muted: #b8a89b; --line: #3a2e27;
    --brand: #ff8a4c; --brand-deep: #ffb08a; --brand-soft: #3a2316; --on-brand: #1a0d05;
    --ok: #6fd394; --ok-soft: #173322; --warn: #f3c164; --warn-soft: #382a10; --bad: #ff8f84; --bad-soft: #3d1a17;
    --info: #8cbcf5; --info-soft: #182a40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17120f; --surface: #211a16; --sunken: #1b1512; --fg: #f6ede6; --muted: #b8a89b; --line: #3a2e27;
  --brand: #ff8a4c; --brand-deep: #ffb08a; --brand-soft: #3a2316; --on-brand: #1a0d05;
  --ok: #6fd394; --ok-soft: #173322; --warn: #f3c164; --warn-soft: #382a10; --bad: #ff8f84; --bad-soft: #3d1a17;
  --info: #8cbcf5; --info-soft: #182a40;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--brand); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.small { min-height: 32px; padding: 4px 12px; font-size: 13px; border-radius: 10px; }
.kbd { font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: .6; font-weight: 500; }

/* Header */
header.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 92%, transparent); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; white-space: nowrap; }
.brand img { width: 32px; height: 32px; border-radius: 8px; }
.brand small { color: var(--muted); font-weight: 500; }
.top .spacer { flex: 1; }
.who { color: var(--muted); font-size: 13px; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Sign in */
.center { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 24px 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); width: min(420px, 100%); }
.card h1 { font-size: 24px; margin: 0 0 6px; }
.card p { margin: 0 0 18px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.input:focus { border-color: var(--brand); outline: none; }
.code { letter-spacing: .4em; font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.error { color: var(--bad); background: var(--bad-soft); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; }

/* Layout */
.app { display: grid; grid-template-columns: 230px minmax(300px, 400px) minmax(0, 1fr); height: calc(100vh - 57px); }
nav.views { border-inline-end: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.view { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; padding: 10px 12px; border-radius: 12px; border: 0; background: transparent; font-weight: 500; }
.view:hover { background: var(--sunken); }
.view[aria-current="true"] { background: var(--brand-soft); color: var(--brand-deep); font-weight: 600; }
.view .count { margin-inline-start: auto; font-size: 12px; font-weight: 600; min-width: 24px; text-align: center; padding: 1px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.view[aria-current="true"] .count { background: var(--surface); color: var(--brand-deep); }
.view .count.hot { background: var(--brand); color: var(--on-brand); }
.view .count.alarm { background: var(--bad); color: #fff; }
.views .sep { height: 1px; background: var(--line); margin: 8px 6px; }
.views .scope { font-size: 12px; color: var(--muted); padding: 4px 12px 10px; }
.views .scope strong { display: block; color: var(--fg); font-size: 13px; }
.views .help { margin-top: auto; font-size: 12px; color: var(--muted); padding: 12px; line-height: 1.7; }

section.list { border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.filters .input { min-height: 38px; padding: 6px 10px; font-size: 14px; }
.filters #search { flex: 1 1 100%; }
.filters select { flex: 1 1 40%; min-width: 0; }
ul.items { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.item { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--sunken); }
.item[aria-selected="true"] { background: var(--brand-soft); }
.thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--sunken); display: grid; place-items: center; font-size: 26px; }
.item .title { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.item .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }
.empty .big { font-size: 36px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.submitted { background: var(--info-soft); color: var(--info); }
.chip.verified { background: var(--brand-soft); color: var(--brand-deep); }
.chip.in_progress { background: var(--warn-soft); color: var(--warn); }
.chip.resolved, .chip.active { background: var(--ok-soft); color: var(--ok); }
.chip.rejected, .chip.flag, .chip.review, .chip.overdue { background: var(--bad-soft); color: var(--bad); }
.chip.duplicate, .chip.neutral { background: var(--sunken); color: var(--muted); }

/* Detail */
section.detail { overflow-y: auto; min-height: 0; }
.detail-inner { padding: 20px 24px 40px; max-width: 880px; }
.back { display: none; }
.d-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.d-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--brand-soft); display: grid; place-items: center; font-size: 28px; flex: none; }
.d-head h2 { margin: 0; font-size: 22px; line-height: 1.25; }
.d-head .meta { color: var(--muted); font-size: 14px; }
.d-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.alert { border-radius: var(--radius); padding: 12px 14px; margin: 14px 0; background: var(--bad-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
.alert strong { color: var(--bad); }
.alert.calm { background: var(--sunken); border-color: var(--line); }
.alert.calm strong { color: var(--muted); }
.alert ul { margin: 6px 0 0; padding-inline-start: 20px; }
.actions { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; margin: 0 -12px 16px; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.actions .label { width: 100%; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 16px; }
.photos a { display: block; border-radius: 12px; overflow: hidden; background: var(--sunken); aspect-ratio: 4 / 3; }
.photos img { width: 100%; height: 100%; object-fit: cover; }
.desc { font-size: 16px; white-space: pre-wrap; margin: 0 0 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.panel.wide { grid-column: 1 / -1; }
.panel h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
.late { color: var(--bad); font-weight: 600; }
.map { height: 220px; border-radius: 12px; overflow: hidden; background: var(--sunken); }
ol.timeline { list-style: none; margin: 0; padding: 0; }
ol.timeline li { position: relative; padding: 0 0 14px 22px; font-size: 14px; }
[dir="rtl"] ol.timeline li { padding: 0 22px 14px 0; }
ol.timeline li::before { content: ""; position: absolute; inset-inline-start: 4px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); }
ol.timeline li::after { content: ""; position: absolute; inset-inline-start: 8px; top: 18px; bottom: 0; width: 1px; background: var(--line); }
ol.timeline li:last-child::after { display: none; }
ol.timeline .note { color: var(--muted); }
.copy { border: 0; background: none; color: var(--brand); font-size: 12px; padding: 0 4px; }

/* Admin: areas and authorities */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 14px; }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.switch input { width: 20px; height: 20px; accent-color: var(--brand); }
table.rules { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rules th, table.rules td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); }
table.rules th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
table.rules input { width: 80px; min-height: 36px; padding: 4px 8px; }
ul.members { list-style: none; margin: 0 0 12px; padding: 0; }
ul.members li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
ul.members li span { flex: 1; overflow-wrap: anywhere; }
.inline { display: flex; gap: 8px; }
.inline .input { flex: 1; min-height: 40px; }
.level-tag { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.crumbs { color: var(--muted); font-size: 13px; margin-bottom: 4px; }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: min(460px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20, 10, 4, .45); }
dialog h3 { margin: 0 0 6px; font-size: 18px; }
dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
dialog textarea { min-height: 90px; resize: vertical; }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

.toast { position: fixed; inset-inline: 0; bottom: 20px; margin: auto; width: max-content; max-width: calc(100vw - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; z-index: 20; box-shadow: var(--shadow); }
.toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 1080px) {
  .app { grid-template-columns: 200px minmax(280px, 360px) minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { display: flex; flex-direction: column; height: auto; min-height: calc(100vh - 57px); }
  nav.views { flex-direction: row; overflow-x: auto; border-inline-end: 0; border-bottom: 1px solid var(--line); padding: 8px; scrollbar-width: none; }
  .view { width: auto; white-space: nowrap; }
  .views .help, .views .scope, .views .sep { display: none; }
  section.list { border-inline-end: 0; }
  ul.items { overflow: visible; }
  .app.showing-detail section.list, .app.showing-detail nav.views { display: none; }
  .app:not(.showing-detail) section.detail { display: none; }
  .back { display: inline-flex; margin-bottom: 12px; }
  .detail-inner { padding: 16px; }
  .who, .brand small { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/icon.png" alt=""><span>Report Me</span><small data-t="moderation">Moderation</small></div>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <button class="btn small ghost" id="lang" type="button" lang="ar">العربية</button>
  <button class="btn small" id="signout" type="button" data-t="signOut" hidden>Sign out</button>
</header>

<!-- Sign in -->
<main id="signin" class="center" hidden>
  <form class="card" id="signin-form" autocomplete="on">
    <h1 data-t="signInTitle">Moderator sign in</h1>
    <p class="muted" data-t="signInBody">We'll email you a 6-digit code. Only moderator and authority accounts can open the dashboard.</p>
    <div class="error" id="signin-error" role="alert" hidden></div>
    <div class="field" id="email-field">
      <label for="email" data-t="email">Email</label>
      <input class="input" id="email" type="email" autocomplete="email" required>
    </div>
    <div class="field" id="code-field" hidden>
      <label for="code" data-t="code">6-digit code</label>
      <input class="input code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
      <button class="btn small ghost" id="change-email" type="button" data-t="changeEmail">Use a different email</button>
    </div>
    <button class="btn primary" id="signin-submit" type="submit" style="width:100%" data-t="sendCode">Send code</button>
  </form>
</main>

<!-- Signed in, but neither staff nor authority -->
<main id="noaccess" class="center" hidden>
  <div class="card">
    <h1 data-t="noAccessTitle">No dashboard access</h1>
    <p class="muted" data-t="noAccessBody">This account isn't a moderator or a member of a local authority. Ask an admin to add it, then sign in again.</p>
    <p class="muted" style="font-size:13px"><span data-t="accountId">Account ID</span>: <code id="noaccess-id"></code></p>
  </div>
</main>

<!-- Dashboard -->
<div class="app" id="app" hidden>
  <nav class="views" id="views" aria-label="Report lists"></nav>
  <section class="list" aria-label="Reports">
    <div class="filters" id="filters">
      <label class="sr" for="search" data-t="search">Search</label>
      <input class="input" id="search" type="search" data-tp="searchPlaceholder" placeholder="Search address or text">
      <label class="sr" for="governorate" data-t="governorate">Governorate</label>
      <select class="input" id="governorate"></select>
      <label class="sr" for="category" data-t="category">Category</label>
      <select class="input" id="category"></select>
    </div>
    <ul class="items" id="items" role="listbox" aria-label="Reports"></ul>
  </section>
  <section class="detail" id="detail" aria-live="polite"></section>
</div>

<dialog id="dialog">
  <form method="dialog" id="dialog-form">
    <h3 id="dialog-title"></h3>
    <p id="dialog-body"></p>
    <div class="field" id="dialog-dup-field" hidden>
      <label for="dialog-dup" data-t="duplicateOf">Original report ID</label>
      <input class="input" id="dialog-dup" placeholder="00000000-0000-0000-0000-000000000000">
    </div>
    <div class="field" id="dialog-assign-field" hidden>
      <label for="dialog-assign" data-t="assignTo">Send to</label>
      <select class="input" id="dialog-assign"></select>
    </div>
    <div class="field">
      <label for="dialog-note" id="dialog-note-label"></label>
      <textarea class="input" id="dialog-note" maxlength="500"></textarea>
    </div>
    <div class="row">
      <button class="btn" value="cancel" data-t="cancel">Cancel</button>
      <button class="btn primary" value="ok" id="dialog-ok"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module">

let lang = readPref("lang") || (navigator.language?.startsWith("ar") ? "ar" : "en");
const t = (key, ...args) => { const v = T[lang][key] ?? T.en[key] ?? key; return typeof v === "function" ? v(...args) : v; };

function readPref(key) { try { return localStorage.getItem(`rm-admin-${key}`); } catch { return null; } }
function writePref(key, value) { try { localStorage.setItem(`rm-admin-${key}`, value); } catch { /* private mode */ } }

function applyLanguage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-tp]").forEach((el) => { el.placeholder = t(el.dataset.tp); });
  const toggle = document.getElementById("lang");
  toggle.textContent = lang === "ar" ? "English" : "العربية";
  toggle.lang = lang === "ar" ? "en" : "ar";
}

// ---------------------------------------------------------------- Small DOM helpers (user text only via textContent)
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = Boolean(v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const $ = (id) => document.getElementById(id);
const locale = () => (lang === "ar" ? "ar-SY" : "en-GB");

function formatDistance(m) {
  if (m == null) return "";
  const n = new Intl.NumberFormat(locale(), { maximumFractionDigits: m >= 1000 ? 1 : 0 });
  return m >= 1000 ? `${n.format(m / 1000)} km` : `${n.format(m)} m`;
}
function formatDate(iso) {
  return new Intl.DateTimeFormat(locale(), { dateStyle: "medium", timeStyle: "short" }).format(new Date(iso));
}
function timeAgo(iso) {
  const rtf = new Intl.RelativeTimeFormat(lang === "ar" ? "ar" : "en", { numeric: "auto" });
  const s = (new Date(iso) - Date.now()) / 1000;
  for (const [unit, size] of [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]]) {
    if (Math.abs(s) >= size) return rtf.format(Math.round(s / size), unit);
  }
  return rtf.format(Math.round(s), "second");
}
const isOverdue = (r) => r.due_at && new Date(r.due_at) < new Date() && OPEN.includes(r.status);

let toastTimer;
function toast(message, bad = false) {
  const el = $("toast");
  el.textContent = message;
  el.className = bad ? "toast bad" : "toast";
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, bad ? 6000 : 2600);
}
function errorText(error) {
  const msg = `${error?.message || ""} ${error?.code || ""}`;
  if (msg.includes("forbidden") || msg.includes("42501")) return t("e_forbidden");
  if (msg.includes("duplicate_of_required")) return t("e_dup");
  if (msg.includes("cannot_ban_staff")) return t("e_staff");
  if (msg.includes("already_central")) return t("e_central");
  if (msg.includes("no_authority")) return t("e_noauth");
  if (msg.includes("user_not_found")) return t("e_user");
  if (msg.includes("invalid_deadline")) return t("e_deadline");
  if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) return t("e_network");
  return t("e_generic");
}

const isAdmin = () => state.me.role === "admin";
const myAreas = () => state.me.authorities.map((a) => a.area_pcode);
const areaName = (pcode) => { const a = state.areas.get(pcode); return a ? (lang === "ar" ? a.name_ar : a.name_en) : pcode; };
const authorityName = (r) => r.assigned_pcode ? ((lang === "ar" ? r.assigned_ar : r.assigned_en) || areaName(r.assigned_pcode)) : t("central");

// Lists in the side bar. Each one adds its filter to the staff_reports query.
function views() {
  const open = (q) => q.eq("needs_review", false).in("status", OPEN);
  const list = [];
  if (!isStaff()) list.push({ id: "mine", icon: "📥", key: "v_mine", hot: true, filter: (q) => open(q).in("assigned_pcode", myAreas()) });
  if (isStaff()) list.push({ id: "review", icon: "⏳", key: "v_review", hot: true, filter: (q) => q.eq("needs_review", true).order("created_at", { ascending: true }) });
  list.push(
    { id: "new", icon: "🆕", key: "v_new", hot: isStaff(), filter: (q) => q.eq("needs_review", false).eq("status", "submitted") },
    { id: "verified", icon: "✅", key: "v_verified", filter: (q) => q.eq("needs_review", false).eq("status", "verified") },
    { id: "progress", icon: "🛠️", key: "v_progress", filter: (q) => q.eq("needs_review", false).eq("status", "in_progress") },
    { id: "overdue", icon: "⏰", key: "v_overdue", alarm: true, filter: (q) => open(q).lt("due_at", new Date().toISOString()).order("due_at", { ascending: true }) },
  );
  if (isStaff()) {
    list.push(
      { id: "central", icon: "🏛️", key: "v_central", hot: true, filter: (q) => open(q).is("assigned_pcode", null) },
      { id: "flagged", icon: "🚩", key: "v_flagged", filter: (q) => q.gt("flag_count", 0).not("status", "in", "(rejected,duplicate)") },
    );
  }
  list.push(
    { id: "resolved", icon: "🎉", key: "v_resolved", filter: (q) => q.eq("status", "resolved") },
    { id: "rejected", icon: "🚫", key: "v_rejected", filter: (q) => q.in("status", ["rejected", "duplicate"]) },
    { id: "all", icon: "🗂️", key: "v_all", filter: (q) => q },
  );
  return list;
}
const currentView = () => views().find((v) => v.id === state.view) || views()[0];

// ---------------------------------------------------------------- Auth
let pendingEmail = "";

async function start() {
  applyLanguage();
  const { data } = await supabase.auth.getSession();
  await onSession(data.session);
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_IN" || event === "SIGNED_OUT") onSession(session);
  });
  window.addEventListener("hashchange", openFromHash);
}

async function onSession(session) {
  state.user = session?.user ?? null;
  $("signout").hidden = !state.user;
  $("who").textContent = state.user?.email ?? "";
  for (const id of ["signin", "noaccess", "app"]) $(id).hidden = true;
  if (!state.user) { showSignIn(); return; }

  const { data: me } = await supabase.rpc("dashboard_me");
  state.me = { role: me?.role ?? null, authorities: me?.authorities ?? [] };
  if (!isStaff() && !state.me.authorities.length) {
    $("noaccess-id").textContent = state.user.id;
    $("noaccess").hidden = false;
    return;
  }
  if (!state.view || (state.view === "admin" && !isAdmin()) || (state.view !== "admin" && !views().some((v) => v.id === state.view))) {
    state.view = views()[0].id;
  }
  $("app").hidden = false;
  await Promise.all([loadCategories(), loadAreas()]);
  renderViews();
  if (state.view === "admin") await showAdmin(); else await refresh();
  openFromHash();
}

function showSignIn() {
  $("signin").hidden = false;
  setSignInStep(pendingEmail ? "code" : "email");
}
function setSignInStep(step) {
  $("email-field").hidden = step !== "email";
  $("code-field").hidden = step !== "code";
  $("signin-submit").textContent = step === "email" ? t("sendCode") : t("signIn");
  $("signin-submit").dataset.t = step === "email" ? "sendCode" : "signIn";
  (step === "email" ? $("email") : $("code")).focus();
}
function signInError(message) {
  $("signin-error").textContent = message || "";
  $("signin-error").hidden = !message;
}

$("signin-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  signInError("");
  const button = $("signin-submit");
  button.disabled = true;
  try {
    if (!pendingEmail) {
      const email = $("email").value.trim();
      // The dashboard never creates accounts; moderators and authority members sign in to the app first.
      const { error } = await supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
      if (error) { signInError(/signups not allowed|not found|422/i.test(error.message) ? t("noAccount") : errorText(error)); return; }
      pendingEmail = email;
      setSignInStep("code");
      toast(t("codeSent"));
    } else {
      const { error } = await supabase.auth.verifyOtp({ email: pendingEmail, token: $("code").value.trim(), type: "email" });
      if (error) { signInError(t("badCode")); return; }
      pendingEmail = "";
      $("code").value = "";
    }
  } finally {
    button.disabled = false;
  }
});
$("change-email").addEventListener("click", () => { pendingEmail = ""; signInError(""); setSignInStep("email"); });
$("signout").addEventListener("click", async () => { await supabase.auth.signOut(); });
$("lang").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  writePref("lang", lang);
  applyLanguage();
  if (!$("signin").hidden) setSignInStep(pendingEmail ? "code" : "email");
  if (!$("app").hidden) {
    renderFilters(); renderViews();
    if (state.view === "admin") { renderAdminList(); renderAdminDetail(); } else { renderList(); renderDetail(); }
  }
});

// ---------------------------------------------------------------- Data
async function loadCategories() {
  const { data } = await supabase.from("categories").select("id, name_en, name_ar, icon, color").order("sort_order");
  state.categories = new Map((data || []).map((c) => [c.id, c]));
}
async function loadAreas() {
  const [{ data }, { data: offices }] = await Promise.all([
    supabase.from("admin_areas").select("pcode, level, parent_pcode, name_en, name_ar").order("pcode"),
    supabase.from("authorities").select("area_pcode, name_en, name_ar"),
  ]);
  state.areas = new Map((data || []).map((a) => [a.pcode, a]));
  state.officeNames = new Map((offices || []).map((o) => [o.area_pcode, o]));
  renderFilters();
}
// The authority's name for an area ("Damascus Governorate"), or the area's name if it has no authority.
const officeName = (pcode) => { const o = state.officeNames.get(pcode); return o ? (lang === "ar" ? o.name_ar : o.name_en) : areaName(pcode); };
const categoryName = (id) => { const c = state.categories.get(id); return c ? (lang === "ar" ? c.name_ar : c.name_en) : id; };
const categoryIcon = (id) => state.categories.get(id)?.icon || "📍";

async function loadCounts() {
  const results = await Promise.all(views().filter((v) => v.id !== "all").map(async (v) => {
    const { count } = await v.filter(supabase.from("staff_reports").select("id", { count: "exact", head: true }));
    return [v.id, count ?? 0];
  }));
  state.counts = Object.fromEntries(results);
  renderViews();
}

let loadToken = 0;
async function loadReports() {
  const token = ++loadToken;
  let query = currentView().filter(supabase.from("staff_reports").select("*")).limit(200);
  if (state.category) query = query.eq("category_id", state.category);
  if (state.governorate) query = query.eq("governorate_pcode", state.governorate);
  if (state.search) {
    const s = state.search.replace(/[%,()]/g, " ");
    query = query.or(`address.ilike.%${s}%,description.ilike.%${s}%`);
  }
  const { data, error } = await query;
  if (token !== loadToken) return;
  if (error) { toast(errorText(error), true); return; }
  state.reports = data || [];
  if (!state.reports.some((r) => r.id === state.selectedId)) state.selectedId = null;
  renderList();
  renderDetail();
}

async function refresh() {
  if (state.view === "admin") { await loadAdminData(); return; }
  await Promise.all([loadCounts(), loadReports()]);
}

// Links in authority emails: …/admin/#report=<id>
async function openFromHash() {
  const id = new URLSearchParams(location.hash.slice(1)).get("report");
  if (!id || $("app").hidden) return;
  if (!state.reports.some((r) => r.id === id)) {
    const { data } = await supabase.from("staff_reports").select("*").eq("id", id).maybeSingle();
    if (!data) return;
    state.view = "all";
    renderViews();
    showReportsLayout();
    state.reports = [data, ...state.reports.filter((r) => r.id !== id)];
    renderList();
  }
  select(id);
}

// ---------------------------------------------------------------- Views + filters + list
function renderViews() {
  const nav = $("views");
  const scope = isStaff()
    ? h("div", { class: "scope" }, h("strong", {}, t("scopeStaff")), state.me.role)
    : h("div", { class: "scope" }, t("scopeAs"), h("strong", {}, state.me.authorities.map((a) => lang === "ar" ? a.name_ar : a.name_en).join(" · ")));
  const viewButton = (v) => {
    const count = state.counts[v.id];
    const countClass = v.alarm && count > 0 ? "count alarm" : `count${v.hot && count > 0 ? " hot" : ""}`;
    return h("button", {
      class: "view", type: "button", "aria-current": String(v.id === state.view),
      onclick: () => switchView(v.id),
    }, h("span", { "aria-hidden": "true" }, v.icon), t(v.key),
      count != null && v.id !== "all" && v.id !== "admin" ? h("span", { class: countClass }, count) : null);
  };
  nav.replaceChildren(...[
    scope,
    ...views().map(viewButton),
    isAdmin() ? h("div", { class: "sep" }) : null,
    isAdmin() ? viewButton({ id: "admin", icon: "🗺️", key: "v_admin" }) : null,
    h("p", { class: "help" }, t("help")),
  ].filter(Boolean));
}

async function switchView(id) {
  state.view = id;
  writePref("view", id);
  state.selectedId = null;
  $("app").classList.remove("showing-detail");
  renderViews();
  if (id === "admin") await showAdmin();
  else { showReportsLayout(); await loadReports(); }
}

function renderFilters() {
  const cat = $("category");
  cat.replaceChildren(h("option", { value: "" }, t("allCategories")),
    ...[...state.categories.values()].map((c) => h("option", { value: c.id }, `${c.icon} ${lang === "ar" ? c.name_ar : c.name_en}`)));
  cat.value = state.category;
  const gov = $("governorate");
  const govs = [...state.areas.values()].filter((a) => a.level === 1).sort((a, b) => areaName(a.pcode).localeCompare(areaName(b.pcode), lang));
  gov.replaceChildren(h("option", { value: "" }, t("allGovernorates")), ...govs.map((a) => h("option", { value: a.pcode }, areaName(a.pcode))));
  gov.value = state.governorate;
}

function statusChip(report) {
  if (report.needs_review) return h("span", { class: "chip review" }, t("inReview"));
  return h("span", { class: `chip ${report.status}` }, t(`s_${report.status}`));
}
const placeLine = (r) => r.subdistrict_pcode
  ? [lang === "ar" ? r.subdistrict_ar : r.subdistrict_en, lang === "ar" ? r.governorate_ar : r.governorate_en].filter(Boolean).join(lang === "ar" ? "، " : ", ")
  : (r.address || "—");

function renderList() {
  const list = $("items");
  if (!state.reports.length) {
    list.replaceChildren(h("li", { class: "empty" }, h("div", { class: "big" }, "✨"), h("strong", {}, t("emptyTitle")), h("div", {}, t("emptyBody"))));
    return;
  }
  list.replaceChildren(...state.reports.map((r) => {
    const photo = r.photo_paths?.[0];
    return h("li", {
      class: "item", role: "option", tabindex: "0", "aria-selected": String(r.id === state.selectedId), "data-id": r.id,
      onclick: () => select(r.id),
      onkeydown: (e) => { if (e.key === "Enter") select(r.id); },
    },
      photo ? h("img", { class: "thumb", src: PHOTO_BASE + photo, alt: "", loading: "lazy" }) : h("div", { class: "thumb", "aria-hidden": "true" }, categoryIcon(r.category_id)),
      h("div", { style: "min-width:0" },
        h("div", { class: "title" }, h("span", { "aria-hidden": "true" }, categoryIcon(r.category_id)), categoryName(r.category_id)),
        h("div", { class: "sub" }, placeLine(r)),
        h("div", { class: "sub" }, timeAgo(r.created_at), " · ", authorityName(r)),
        h("div", { class: "tags" }, statusChip(r),
          isOverdue(r) ? h("span", { class: "chip overdue" }, "⏰ ", t("overdue")) : null,
          r.escalation_count > 0 ? h("span", { class: "chip neutral" }, "↑", r.escalation_count) : null,
          r.flag_count > 0 ? h("span", { class: "chip flag" }, "🚩 ", t("flags", r.flag_count)) : null,
          r.reporter_banned_at ? h("span", { class: "chip rejected" }, t("f_banned")) : null)));
  }));
}

function select(id) {
  state.selectedId = id;
  document.querySelectorAll(".item").forEach((el) => el.setAttribute("aria-selected", String(el.dataset.id === id)));
  $("app").classList.add("showing-detail");
  renderDetail();
}

function showReportsLayout() {
  $("filters").hidden = false;
}

// ---------------------------------------------------------------- Report detail
async function renderDetail() {
  if (state.view === "admin") return;
  const pane = $("detail");
  if (state.detailMap) { state.detailMap.remove(); state.detailMap = null; }
  const r = state.reports.find((x) => x.id === state.selectedId);
  if (!r) {
    pane.replaceChildren(h("div", { class: "empty" }, h("div", { class: "big" }, "🗂️"), t("pick")));
    return;
  }

  const actions = h("div", { class: "actions" });
  if (r.needs_review) {
    actions.append(h("span", { class: "label" }, t("decide")),
      h("button", { class: "btn ok", type: "button", onclick: () => approve(r) }, "✓ ", t("approve"), h("span", { class: "kbd" }, "A")),
      h("button", { class: "btn bad", type: "button", onclick: () => reject(r) }, t("reject"), h("span", { class: "kbd" }, "R")));
  } else {
    actions.append(h("span", { class: "label" }, t("changeStatus")));
    const next = {
      submitted: [["verified", "verify", "primary"], ["in_progress", "start"], ["resolved", "resolve"]],
      verified: [["in_progress", "start", "primary"], ["resolved", "resolve"]],
      in_progress: [["resolved", "resolve", "ok"]],
      resolved: [["in_progress", "reopen"]],
      rejected: [["submitted", "reopen"]],
      duplicate: [["submitted", "reopen"]],
    }[r.status] || [];
    next.forEach(([status, key, style], i) => actions.append(h("button", { class: `btn ${style || ""}`, type: "button", onclick: () => changeStatus(r, status, key) },
      t(key), i === 0 && status === "verified" ? h("span", { class: "kbd" }, "A") : null)));
    if (!["rejected", "duplicate"].includes(r.status)) {
      actions.append(
        h("button", { class: "btn", type: "button", onclick: () => markDuplicate(r) }, t("duplicate")),
        h("button", { class: "btn bad", type: "button", onclick: () => reject(r) }, t("reject"), h("span", { class: "kbd" }, "R")));
    }
    if (OPEN.includes(r.status) && r.assigned_pcode) {
      actions.append(h("button", { class: "btn", type: "button", onclick: () => escalate(r) }, "↑ ", t("escalate"), h("span", { class: "kbd" }, "E")));
    }
    if (OPEN.includes(r.status) && isStaff()) {
      actions.append(h("button", { class: "btn", type: "button", onclick: () => assign(r) }, t("assign")));
    }
  }
  if (r.reporter_id && isStaff()) {
    actions.append(r.reporter_banned_at
      ? h("button", { class: "btn ghost", type: "button", onclick: () => unban(r) }, t("unban"))
      : h("button", { class: "btn ghost", type: "button", style: "color:var(--bad)", onclick: () => ban(r) }, "⛔ ", t("ban")));
  }

  const reasons = (r.review_reasons || []).map((code) => code === "far_from_device" ? t("r_far_from_device", r.device_distance_m) : t(`r_${code}`));
  const mapBox = h("div", { class: "map", role: "img", "aria-label": `${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}` });
  const historyList = h("ol", { class: "timeline" }, h("li", { class: "muted" }, "…"));
  const assignmentList = h("ol", { class: "timeline" }, h("li", { class: "muted" }, "…"));
  const flagsBox = h("div", { class: "muted" }, "…");
  const areaPath = [r.subdistrict_pcode, r.district_pcode, r.governorate_pcode].filter(Boolean).map(areaName).join(lang === "ar" ? " ← " : " → ");

  pane.replaceChildren(h("div", { class: "detail-inner" },
    h("button", { class: "btn small back", type: "button", onclick: () => $("app").classList.remove("showing-detail") }, lang === "ar" ? "→ " : "← ", t("back")),
    h("div", { class: "d-head" },
      h("div", { class: "d-icon", "aria-hidden": "true" }, categoryIcon(r.category_id)),
      h("div", {},
        h("h2", {}, categoryName(r.category_id)),
        h("div", { class: "meta" }, placeLine(r), " · ", timeAgo(r.created_at)),
        h("div", { class: "d-chips" }, statusChip(r),
          isOverdue(r) ? h("span", { class: "chip overdue" }, "⏰ ", t("overdue")) : null,
          h("span", { class: "chip neutral" }, t(`sev_${r.severity}`)),
          r.upvote_count > 0 ? h("span", { class: "chip neutral" }, "👍 ", t("votes", r.upvote_count)) : null,
          r.flag_count > 0 ? h("span", { class: "chip flag" }, "🚩 ", t("flags", r.flag_count)) : null))),
    actions,
    reasons.length ? h("div", { class: r.needs_review ? "alert" : "alert calm", role: "note" },
      h("strong", {}, t(r.needs_review ? "whyReview" : "spamChecks")), h("ul", {}, reasons.map((x) => h("li", {}, x)))) : null,
    r.photo_paths?.length ? h("div", { class: "photos" }, r.photo_paths.map((p) => h("a", { href: PHOTO_BASE + p, target: "_blank", rel: "noopener" }, h("img", { src: PHOTO_BASE + p, alt: "", loading: "lazy" })))) : null,
    r.description ? h("p", { class: "desc" }, r.description) : null,
    h("div", { class: "grid2" },
      h("div", { class: "panel" }, h("h3", {}, t("responsibility")),
        h("dl", { class: "facts" },
          h("dt", {}, t("f_area")), h("dd", {}, areaPath || t("noArea")),
          h("dt", {}, t("f_responsible")), h("dd", {}, authorityName(r)),
          h("dt", {}, t("f_deadline")), h("dd", { class: isOverdue(r) ? "late" : null }, r.due_at ? `${formatDate(r.due_at)} (${timeAgo(r.due_at)})` : "—"),
          h("dt", {}, t("f_escalations")), h("dd", {}, r.escalation_count || 0))),
      h("div", { class: "panel" }, h("h3", {}, t("assignments")), assignmentList),
      h("div", { class: "panel" }, h("h3", {}, t("location")), mapBox,
        h("dl", { class: "facts", style: "margin-top:10px" },
          h("dt", {}, t("f_address")), h("dd", {}, r.address || "—"),
          h("dt", {}, t("f_coords")), h("dd", {}, `${r.lat.toFixed(5)}, ${r.lng.toFixed(5)} `,
            h("a", { href: `https://www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lng}#map=18/${r.lat}/${r.lng}`, target: "_blank", rel: "noopener" }, t("openMaps"))),
          r.device_distance_m != null ? [h("dt", {}, t("f_distance")), h("dd", {}, formatDistance(r.device_distance_m))] : null)),
      h("div", { class: "panel" }, h("h3", {}, t("details")),
        h("dl", { class: "facts" },
          h("dt", {}, t("f_reported")), h("dd", {}, formatDate(r.created_at)),
          h("dt", {}, t("f_severity")), h("dd", {}, t(`sev_${r.severity}`)),
          h("dt", {}, t("reporter")), h("dd", {}, r.reporter_name || t("anonymous"),
            r.is_anonymous ? h("span", { class: "muted" }, ` (${t("f_hidden")})`) : null),
          isStaff() ? [h("dt", {}, t("f_banned")), h("dd", {}, r.reporter_banned_at ? `${t("yes")} · ${formatDate(r.reporter_banned_at)}` : t("no"))] : null,
          h("dt", {}, t("f_id")), h("dd", {}, h("code", { style: "font-size:12px" }, r.id), copyButton(r.id)),
          r.duplicate_of ? [h("dt", {}, t("duplicateOf")), h("dd", {}, h("code", { style: "font-size:12px" }, r.duplicate_of))] : null)),
      h("div", { class: "panel" }, h("h3", {}, t("history")), historyList),
      h("div", { class: "panel" }, h("h3", {}, t("flagsTitle")), flagsBox),
    ),
  ));
  pane.scrollTop = 0;

  showMap(mapBox, r);
  const [{ data: history }, { data: flags }, { data: assignments }] = await Promise.all([
    supabase.from("report_status_history").select("from_status, to_status, note, created_at").eq("report_id", r.id).order("created_at"),
    supabase.from("report_flags").select("reason, created_at").eq("report_id", r.id).order("created_at", { ascending: false }),
    supabase.from("report_assignments").select("from_pcode, to_pcode, reason, note, created_at").eq("report_id", r.id).order("created_at"),
  ]);
  if (state.selectedId !== r.id) return;
  historyList.replaceChildren(...(history?.length ? history.map((x) => h("li", {},
    h("strong", {}, t(`s_${x.to_status}`)), " · ", h("span", { class: "muted" }, formatDate(x.created_at)),
    x.note ? h("div", { class: "note" }, x.note) : null)) : [h("li", { class: "muted" }, t("noHistory"))]));
  assignmentList.replaceChildren(...(assignments?.length ? assignments.map((x) => h("li", {},
    h("strong", {}, t(`a_${x.reason}`)), " · ", h("span", { class: "muted" }, formatDate(x.created_at)),
    h("div", {}, `${t("movedTo")}: ${x.to_pcode ? officeName(x.to_pcode) : t("central")}`),
    x.note ? h("div", { class: "note" }, x.note) : null)) : [h("li", { class: "muted" }, t("noHistory"))]));
  flagsBox.replaceChildren(flags?.length
    ? h("ul", { style: "margin:0;padding-inline-start:18px" }, flags.map((f) => h("li", {}, t(`fr_${f.reason}`), h("span", { class: "muted" }, ` · ${timeAgo(f.created_at)}`))))
    : t("noFlags"));
}

function copyButton(text) {
  const b = h("button", { class: "copy", type: "button" }, t("copy"));
  b.addEventListener("click", async () => { try { await navigator.clipboard.writeText(text); b.textContent = t("copied"); } catch { /* clipboard blocked */ } });
  return b;
}

async function showMap(container, r) {
  try {
    const maplibre = window.maplibregl || (await import("https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/+esm")).default;
    if (state.selectedId !== r.id) return;
    const map = new maplibre.Map({ container, style: MAP_STYLE, center: [r.lng, r.lat], zoom: 16, attributionControl: { compact: true }, cooperativeGestures: true });
    new maplibre.Marker({ color: "#e8590c" }).setLngLat([r.lng, r.lat]).addTo(map);
    state.detailMap = map;
  } catch {
    container.textContent = `${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}`;
  }
}

// ---------------------------------------------------------------- Report actions
function ask({ title, body, okText, okClass = "primary", noteLabel = t("noteLabel"), withDuplicate = false, assignOptions = null }) {
  const dialog = $("dialog");
  $("dialog-title").textContent = title;
  $("dialog-body").textContent = body;
  $("dialog-note-label").textContent = noteLabel;
  $("dialog-note").value = "";
  $("dialog-dup").value = "";
  $("dialog-dup-field").hidden = !withDuplicate;
  $("dialog-assign-field").hidden = !assignOptions;
  if (assignOptions) $("dialog-assign").replaceChildren(...assignOptions);
  const ok = $("dialog-ok");
  ok.textContent = okText;
  ok.className = `btn ${okClass}`;
  return new Promise((resolve) => {
    dialog.addEventListener("close", () => {
      resolve(dialog.returnValue === "ok" ? {
        note: $("dialog-note").value.trim() || null,
        duplicateOf: $("dialog-dup").value.trim() || null,
        assignTo: $("dialog-assign").value,
      } : null);
    }, { once: true });
    dialog.showModal();
    (withDuplicate ? $("dialog-dup") : assignOptions ? $("dialog-assign") : $("dialog-note")).focus();
  });
}

async function run(rpc, args, doneText) {
  const { data, error } = await supabase.rpc(rpc, args);
  if (error) { toast(errorText(error), true); return false; }
  toast(typeof doneText === "function" ? doneText(data) : doneText);
  const index = state.reports.findIndex((x) => x.id === args.p_report_id);
  await refresh();
  // Keep moving: select the next report in the list.
  const next = state.reports[Math.min(Math.max(index, 0), state.reports.length - 1)];
  if (next && !state.reports.some((x) => x.id === state.selectedId)) select(next.id);
  else renderDetail();
  return true;
}

function approve(r) { return run("review_report", { p_report_id: r.id, p_approve: true, p_note: null }, t("done_approve")); }

async function reject(r) {
  const answer = await ask({ title: t("d_reject"), body: t("d_reject_body"), okText: t("reject"), okClass: "bad" });
  if (!answer) return;
  if (r.needs_review) return run("review_report", { p_report_id: r.id, p_approve: false, p_note: answer.note }, t("done_reject"));
  return run("set_report_status", { p_report_id: r.id, p_status: "rejected", p_note: answer.note }, t("done_reject"));
}

async function changeStatus(r, status, key) {
  const answer = await ask({ title: t("d_status", t(`s_${status}`)), body: t("d_status_body"), okText: t(key) });
  if (!answer) return;
  return run("set_report_status", { p_report_id: r.id, p_status: status, p_note: answer.note }, t("done_status"));
}

async function markDuplicate(r) {
  const answer = await ask({ title: t("d_dup"), body: t("d_dup_body"), okText: t("duplicate"), withDuplicate: true });
  if (!answer) return;
  return run("set_report_status", { p_report_id: r.id, p_status: "duplicate", p_note: answer.note, p_duplicate_of: answer.duplicateOf }, t("done_status"));
}

async function escalate(r) {
  const answer = await ask({ title: t("d_escalate"), body: t("d_escalate_body"), okText: t("escalate"), noteLabel: t("escalateNoteLabel") });
  if (!answer) return;
  return run("escalate_report", { p_report_id: r.id, p_note: answer.note }, (to) => t("done_escalate", to ? officeName(to) : t("central")));
}

async function assign(r) {
  const { data } = await supabase.from("authority_directory").select("area_pcode, level, name_en, name_ar, is_active").eq("is_active", true).order("level").order("area_pcode");
  const options = (data || []).map((a) => h("option", { value: a.area_pcode }, `${lang === "ar" ? a.name_ar : a.name_en} · ${t(`lv${a.level}`)}`));
  if (!options.length) { toast(t("e_noauth"), true); return; }
  const answer = await ask({ title: t("d_assign"), body: t("d_assign_body"), okText: t("assign").replace("…", ""), noteLabel: t("escalateNoteLabel"), assignOptions: options });
  if (!answer) return;
  return run("assign_report", { p_report_id: r.id, p_area_pcode: answer.assignTo, p_note: answer.note }, t("done_assign"));
}

async function ban(r) {
  const answer = await ask({ title: t("d_ban"), body: t("d_ban_body"), okText: t("ban"), okClass: "bad", noteLabel: t("reasonLabel") });
  if (!answer) return;
  const { data, error } = await supabase.rpc("ban_user", { p_user_id: r.reporter_id, p_reason: answer.note });
  if (error) { toast(errorText(error), true); return; }
  toast(t("done_ban", data ?? 0));
  await refresh();
}

async function unban(r) {
  const answer = await ask({ title: t("d_unban"), body: t("d_unban_body"), okText: t("unban"), noteLabel: t("reasonLabel") });
  if (!answer) return;
  const { error } = await supabase.rpc("unban_user", { p_user_id: r.reporter_id });
  if (error) { toast(errorText(error), true); return; }
  toast(t("done_unban"));
  await refresh();
}

// ---------------------------------------------------------------- Admin: areas and authorities
async function showAdmin() {
  $("filters").hidden = true;
  if (state.detailMap) { state.detailMap.remove(); state.detailMap = null; }
  await loadAdminData();
}

async function loadAdminData() {
  const [{ data: authorities }, { data: rules }, { data: settings }] = await Promise.all([
    supabase.from("authority_directory").select("*"),
    supabase.from("escalation_rules").select("level, verify_within, fix_within").order("level", { ascending: false }),
    supabase.from("app_settings").select("restrict_to_service_area").maybeSingle(),
  ]);
  state.authorities = new Map((authorities || []).map((a) => [a.area_pcode, a]));
  state.rules = rules || [];
  state.settings = settings;
  renderAdminList();
  renderAdminDetail();
}

function renderAdminList() {
  const list = $("items");
  const head = h("li", { style: "padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px" },
    h("input", { class: "input", type: "search", placeholder: t("areaSearch"), value: state.adminSearch,
      oninput: (e) => { state.adminSearch = e.target.value; renderAdminItems(); } }),
    h("select", { class: "input", onchange: (e) => { state.adminLevel = e.target.value; renderAdminItems(); } },
      h("option", { value: "" }, t("allLevels")), [1, 2, 3].map((l) => h("option", { value: String(l) }, t(`lv${l}`)))),
    h("button", { class: "btn small", type: "button", onclick: () => { state.adminSelected = null; renderAdminList(); renderAdminDetail(); $("app").classList.add("showing-detail"); } }, "⚙️ ", t("settings")));
  head.querySelector("select").value = state.adminLevel;
  list.replaceChildren(head);
  renderAdminItems();
}

function renderAdminItems() {
  const list = $("items");
  [...list.querySelectorAll(".item")].forEach((el) => el.remove());
  const q = state.adminSearch.trim().toLowerCase();
  const areas = [...state.areas.values()]
    .filter((a) => a.level >= 1 && (!state.adminLevel || String(a.level) === state.adminLevel))
    .filter((a) => !q || a.name_en.toLowerCase().includes(q) || a.name_ar.includes(q) || a.pcode.toLowerCase().includes(q))
    .sort((a, b) => a.pcode.localeCompare(b.pcode))
    .slice(0, 400);
  list.append(...areas.map((a) => {
    const authority = state.authorities.get(a.pcode);
    const parent = a.parent_pcode && a.level > 1 ? areaName(a.parent_pcode) : "";
    return h("li", { class: "item", style: "grid-template-columns:1fr", role: "option", tabindex: "0", "aria-selected": String(a.pcode === state.adminSelected),
      onclick: () => { state.adminSelected = a.pcode; renderAdminItems(); renderAdminDetail(); $("app").classList.add("showing-detail"); },
      onkeydown: (e) => { if (e.key === "Enter") e.currentTarget.click(); } },
      h("div", { style: "min-width:0" },
        h("div", { class: "level-tag" }, t(`lv${a.level}`), " · ", a.pcode),
        h("div", { class: "title" }, areaName(a.pcode)),
        parent ? h("div", { class: "sub" }, parent) : null,
        h("div", { class: "tags" }, authority
          ? [h("span", { class: authority.is_active ? "chip active" : "chip neutral" }, t("hasAuthority")),
             authority.open_count ? h("span", { class: "chip neutral" }, t("openCount", authority.open_count)) : null,
             authority.overdue_count ? h("span", { class: "chip overdue" }, t("overdueCount", authority.overdue_count)) : null]
          : h("span", { class: "chip neutral" }, t("noAuthority")))));
  }));
}

function renderAdminDetail() {
  if (state.view !== "admin") return;
  const pane = $("detail");
  const back = h("button", { class: "btn small back", type: "button", onclick: () => $("app").classList.remove("showing-detail") }, lang === "ar" ? "→ " : "← ", t("back"));
  if (!state.adminSelected) { pane.replaceChildren(h("div", { class: "detail-inner" }, back, settingsPanel())); return; }
  const area = state.areas.get(state.adminSelected);
  pane.replaceChildren(h("div", { class: "detail-inner" }, back, authorityPanel(area)));
}

function settingsPanel() {
  const restrict = h("input", { type: "checkbox", id: "restrict", checked: state.settings?.restrict_to_service_area ?? true });
  restrict.addEventListener("change", async () => {
    const { error } = await supabase.rpc("set_restrict_to_service_area", { p_restrict: restrict.checked });
    if (error) { toast(errorText(error), true); restrict.checked = !restrict.checked; } else toast(t("saved"));
  });
  const rows = state.rules.map((rule) => {
    const days = (interval) => parseInt(String(interval).match(/(\d+) day/)?.[1] ?? "0", 10);
    const verify = h("input", { class: "input", type: "number", min: "1", max: "365", value: String(days(rule.verify_within)), "aria-label": t("verifyDays") });
    const fix = h("input", { class: "input", type: "number", min: "1", max: "365", value: String(days(rule.fix_within)), "aria-label": t("fixDays") });
    const save = h("button", { class: "btn small", type: "button", onclick: async () => {
      const { error } = await supabase.rpc("save_escalation_rule", { p_level: rule.level, p_verify_days: Number(verify.value), p_fix_days: Number(fix.value) });
      toast(error ? errorText(error) : t("saved"), Boolean(error));
    } }, t("save"));
    return h("tr", {}, h("td", {}, t(`lv${rule.level}`)), h("td", {}, verify), h("td", {}, fix), h("td", {}, save));
  });
  const reroute = h("button", { class: "btn", type: "button", onclick: async () => {
    const { data, error } = await supabase.rpc("reroute_open_reports");
    toast(error ? errorText(error) : t("rerouted", data ?? 0), Boolean(error));
  } }, "↻ ", t("reroute"));
  return h("div", { style: "display:grid;gap:16px" },
    h("h2", { style: "margin:0" }, t("settings")),
    h("div", { class: "panel" },
      h("label", { class: "switch", for: "restrict" }, restrict, t("restrictLabel")),
      h("p", { class: "muted", style: "margin:8px 0 0;font-size:14px" }, t("restrictHelp"))),
    h("div", { class: "panel" }, h("h3", {}, t("deadlines")),
      h("table", { class: "rules" },
        h("thead", {}, h("tr", {}, h("th", {}, t("level")), h("th", {}, t("verifyDays")), h("th", {}, t("fixDays")), h("th", {}))),
        h("tbody", {}, rows))),
    h("div", { class: "panel" }, h("h3", {}, t("reroute")),
      h("p", { class: "muted", style: "margin:0 0 10px;font-size:14px" }, t("rerouteHelp")), reroute),
    h("p", { class: "muted" }, t("pickArea")));
}

function authorityPanel(area) {
  const existing = state.authorities.get(area.pcode);
  const crumbs = [];
  for (let p = area.parent_pcode; p && state.areas.get(p)?.level >= 1; p = state.areas.get(p)?.parent_pcode) crumbs.unshift(areaName(p));
  const levelWord = { 1: ["Governorate", "محافظة"], 2: ["District", "منطقة"], 3: ["Subdistrict", "ناحية"] }[area.level];
  const field = (label, input) => h("div", { class: "field" }, h("label", {}, label), input);
  const nameEn = h("input", { class: "input", value: existing?.name_en ?? `${area.name_en} ${levelWord[0]}` });
  const nameAr = h("input", { class: "input", dir: "rtl", value: existing?.name_ar ?? `${levelWord[1]} ${area.name_ar}` });
  const email = h("input", { class: "input", type: "email", dir: "ltr", value: existing?.email ?? "" });
  const phone = h("input", { class: "input", type: "tel", dir: "ltr", value: existing?.phone ?? "" });
  const active = h("input", { type: "checkbox", id: "auth-active", checked: existing ? existing.is_active : true });
  const save = h("button", { class: "btn primary", type: "button", onclick: async () => {
    save.disabled = true;
    const { error } = await supabase.rpc("save_authority", {
      p_area_pcode: area.pcode, p_name_en: nameEn.value, p_name_ar: nameAr.value, p_email: email.value, p_phone: phone.value, p_is_active: active.checked,
    });
    save.disabled = false;
    if (error) { toast(errorText(error), true); return; }
    toast(t("saved"));
    await loadAdminData();
  } }, t("save"));

  const membersBox = h("div", {}, existing ? h("p", { class: "muted" }, "…") : null);
  if (existing) loadMembers(existing.id, membersBox);

  return h("div", { style: "display:grid;gap:16px" },
    h("div", {}, h("div", { class: "crumbs" }, crumbs.join(lang === "ar" ? " ← " : " → ")),
      h("h2", { style: "margin:0" }, areaName(area.pcode)), h("div", { class: "level-tag" }, t(`lv${area.level}`), " · ", area.pcode)),
    h("div", { class: "panel" }, h("h3", {}, t("authority")),
      h("div", { class: "form-grid" }, field(t("nameEn"), nameEn), field(t("nameAr"), nameAr), field(t("contactEmail"), email), field(t("phone"), phone)),
      h("label", { class: "switch", for: "auth-active", style: "margin-bottom:14px" }, active, t("activeLabel")),
      save,
      existing ? h("span", { class: "muted", style: "margin-inline-start:12px;font-size:14px" },
        t("openCount", existing.open_count), " · ", t("overdueCount", existing.overdue_count)) : null),
    existing ? h("div", { class: "panel" }, h("h3", {}, t("members")), membersBox) : null);
}

async function loadMembers(authorityId, box) {
  const { data, error } = await supabase.rpc("authority_member_list", { p_authority_id: authorityId });
  if (error) { box.replaceChildren(h("p", { class: "error" }, errorText(error))); return; }
  const input = h("input", { class: "input", type: "email", dir: "ltr", placeholder: t("memberEmail") });
  const add = h("button", { class: "btn", type: "button", onclick: async () => {
    if (!input.value.trim()) return;
    const { error: e } = await supabase.rpc("add_authority_member", { p_authority_id: authorityId, p_email: input.value.trim() });
    if (e) { toast(errorText(e), true); return; }
    toast(t("added"));
    await loadAdminData();
  } }, t("addMember"));
  box.replaceChildren(
    data?.length
      ? h("ul", { class: "members" }, data.map((m) => h("li", {},
          h("span", {}, m.email, m.display_name ? h("span", { class: "muted" }, ` · ${m.display_name}`) : null),
          h("button", { class: "btn small bad", type: "button", onclick: async () => {
            const { error: e } = await supabase.rpc("remove_authority_member", { p_authority_id: authorityId, p_user_id: m.user_id });
            if (e) { toast(errorText(e), true); return; }
            toast(t("removed"));
            await loadAdminData();
          } }, t("remove")))))
      : h("p", { class: "muted" }, t("noMembers")),
    h("div", { class: "inline" }, input, add));
}

// ---------------------------------------------------------------- Filters, keys, refresh
let searchTimer;
$("search").addEventListener("input", (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.search = e.target.value.trim(); loadReports(); }, 300); });
$("category").addEventListener("change", (e) => { state.category = e.target.value; loadReports(); });
$("governorate").addEventListener("change", (e) => { state.governorate = e.target.value; loadReports(); });

document.addEventListener("keydown", (e) => {
  if ($("app").hidden || state.view === "admin" || $("dialog").open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
  const index = state.reports.findIndex((x) => x.id === state.selectedId);
  const r = state.reports[index];
  const go = (n) => { if (n) { select(n.id); document.querySelector(`.item[data-id="${n.id}"]`)?.scrollIntoView({ block: "nearest" }); } };
  if (e.key === "j" || e.key === "ArrowDown") { go(state.reports[index + 1] || state.reports[0]); e.preventDefault(); }
  else if (e.key === "k" || e.key === "ArrowUp") { go(state.reports[index - 1] || state.reports[state.reports.length - 1]); e.preventDefault(); }
  else if (e.key === "a" && r) { r.needs_review ? approve(r) : r.status === "submitted" && changeStatus(r, "verified", "verify"); }
  else if (e.key === "r" && r && !["rejected", "duplicate"].includes(r.status)) { reject(r); }
  else if (e.key === "e" && r && r.assigned_pcode && OPEN.includes(r.status) && !r.needs_review) { escalate(r); }
});

// New reports arrive while the page is open: refresh the counts every minute and when the tab comes back.
setInterval(() => { if (!$("app").hidden && !document.hidden && state.view !== "admin") loadCounts(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").hidden) refresh(); });

start();
</script>
