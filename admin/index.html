<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Report Me Dashboard</title>
<link rel="icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Government dashboard. Layout: header, then three columns on wide screens (lists | items | detail);
   on phones the detail replaces the list and the lists become a scrolling tab row. */
:root {
  --bg: #fffaf6; --surface: #ffffff; --sunken: #fbf3ec; --fg: #22180f; --muted: #6b5d52; --line: #f0e3d8;
  --brand: #e8590c; --brand-deep: #b83c0c; --brand-soft: #fde8db; --on-brand: #ffffff;
  --ok: #1f7a3d; --ok-soft: #dff3e6; --warn: #9a5b00; --warn-soft: #fdf0d5; --bad: #b42318; --bad-soft: #fde4e1;
  --info: #1d5fa8; --info-soft: #e1edfb;
  --font: "Readex Pro", system-ui, -apple-system, "Segoe UI", "Geeza Pro", sans-serif;
  --radius: 14px; --shadow: 0 10px 30px -18px rgba(120, 50, 10, .35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120f; --surface: #211a16; --sunken: #1b1512; --fg: #f6ede6; --muted: #b8a89b; --line: #3a2e27;
    --brand: #ff8a4c; --brand-deep: #ffb08a; --brand-soft: #3a2316; --on-brand: #1a0d05;
    --ok: #6fd394; --ok-soft: #173322; --warn: #f3c164; --warn-soft: #382a10; --bad: #ff8f84; --bad-soft: #3d1a17;
    --info: #8cbcf5; --info-soft: #182a40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17120f; --surface: #211a16; --sunken: #1b1512; --fg: #f6ede6; --muted: #b8a89b; --line: #3a2e27;
  --brand: #ff8a4c; --brand-deep: #ffb08a; --brand-soft: #3a2316; --on-brand: #1a0d05;
  --ok: #6fd394; --ok-soft: #173322; --warn: #f3c164; --warn-soft: #382a10; --bad: #ff8f84; --bad-soft: #3d1a17;
  --info: #8cbcf5; --info-soft: #182a40;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--brand); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.small { min-height: 32px; padding: 4px 12px; font-size: 13px; border-radius: 10px; }
.kbd { font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: .6; font-weight: 500; }

header.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 92%, transparent); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; white-space: nowrap; }
.brand img { width: 32px; height: 32px; border-radius: 8px; }
.brand small { color: var(--muted); font-weight: 500; }
.top .spacer { flex: 1; }
.who { color: var(--muted); font-size: 13px; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.center { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 24px 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); width: min(420px, 100%); }
.card h1 { font-size: 24px; margin: 0 0 6px; }
.card p { margin: 0 0 18px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .field .label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }
.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.input:focus { border-color: var(--brand); outline: none; }
textarea.input { min-height: 80px; resize: vertical; }
.code { letter-spacing: .4em; font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.error { color: var(--bad); background: var(--bad-soft); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; }

.app { display: grid; grid-template-columns: 230px minmax(300px, 400px) minmax(0, 1fr); height: calc(100vh - 57px); }
nav.views { border-inline-end: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.view { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; padding: 9px 12px; border-radius: 12px; border: 0; background: transparent; font-weight: 500; }
.view:hover { background: var(--sunken); }
.view[aria-current="true"] { background: var(--brand-soft); color: var(--brand-deep); font-weight: 600; }
.view .count { margin-inline-start: auto; font-size: 12px; font-weight: 600; min-width: 24px; text-align: center; padding: 1px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.view[aria-current="true"] .count { background: var(--surface); color: var(--brand-deep); }
.view .count.hot { background: var(--brand); color: var(--on-brand); }
.view .count.alarm { background: var(--bad); color: #fff; }
.views .section { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 14px 12px 4px; }
.views .scope { font-size: 12px; color: var(--muted); padding: 4px 12px 8px; }
.views .scope strong { display: block; color: var(--fg); font-size: 13px; }
.views .help { margin-top: auto; font-size: 12px; color: var(--muted); padding: 12px; line-height: 1.7; }

section.list { border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.filters .input { min-height: 38px; padding: 6px 10px; font-size: 14px; }
.filters .wide { flex: 1 1 100%; }
.filters select { flex: 1 1 30%; min-width: 0; }
ul.items { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.item { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item.text-only { grid-template-columns: 1fr; }
.item:hover { background: var(--sunken); }
.item[aria-selected="true"] { background: var(--brand-soft); }
.thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--sunken); display: grid; place-items: center; font-size: 26px; }
.item .title { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.item .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }
.empty .big { font-size: 36px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.new, .chip.submitted { background: var(--info-soft); color: var(--info); }
.chip.verified { background: var(--brand-soft); color: var(--brand-deep); }
.chip.in_progress { background: var(--warn-soft); color: var(--warn); }
.chip.resolved, .chip.active { background: var(--ok-soft); color: var(--ok); }
.chip.rejected, .chip.flag, .chip.review, .chip.overdue { background: var(--bad-soft); color: var(--bad); }
.chip.duplicate, .chip.transferred, .chip.neutral { background: var(--sunken); color: var(--muted); }

section.detail { overflow-y: auto; min-height: 0; }
.detail-inner { padding: 20px 24px 40px; max-width: 900px; }
.back { display: none; }
.d-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.d-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--brand-soft); display: grid; place-items: center; font-size: 28px; flex: none; }
.d-head h2 { margin: 0; font-size: 22px; line-height: 1.25; }
.d-head .meta { color: var(--muted); font-size: 14px; }
.d-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.alert { border-radius: var(--radius); padding: 12px 14px; margin: 14px 0; background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
.alert strong { color: var(--bad); }
.alert.calm { background: var(--sunken); border-color: var(--line); }
.alert.calm strong { color: var(--muted); }
.alert ul { margin: 6px 0 0; padding-inline-start: 20px; }
.actions { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; margin: 0 -12px 16px; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.actions .label { width: 100%; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 16px; }
.photos a { display: block; border-radius: 12px; overflow: hidden; background: var(--sunken); aspect-ratio: 4 / 3; }
.photos img { width: 100%; height: 100%; object-fit: cover; }
.desc { font-size: 16px; white-space: pre-wrap; margin: 0 0 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.panel h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
.late { color: var(--bad); font-weight: 600; }
.map { height: 220px; border-radius: 12px; overflow: hidden; background: var(--sunken); }
ol.timeline { list-style: none; margin: 0; padding: 0; }
ol.timeline li { position: relative; padding: 0 0 14px 22px; font-size: 14px; }
[dir="rtl"] ol.timeline li { padding: 0 22px 14px 0; }
ol.timeline li::before { content: ""; position: absolute; inset-inline-start: 4px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); }
ol.timeline li::after { content: ""; position: absolute; inset-inline-start: 8px; top: 18px; bottom: 0; width: 1px; background: var(--line); }
ol.timeline li:last-child::after { display: none; }
ol.timeline .note { color: var(--muted); }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
ul.plain li:last-child { border-bottom: 0; }
ul.plain li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.linkish { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; text-align: start; }
.copy { border: 0; background: none; color: var(--brand); font-size: 12px; padding: 0 4px; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 14px; }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.switch input, .checks input { width: 18px; height: 18px; accent-color: var(--brand); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.checks label { display: flex; align-items: center; gap: 8px; font-weight: 500; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
table.rules { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rules th, table.rules td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); }
table.rules th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
table.rules input { width: 80px; min-height: 36px; padding: 4px 8px; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; }
.inline .input { flex: 1; min-height: 40px; min-width: 160px; }
.inline select.input { flex: 0 0 auto; min-width: 110px; }
.level-tag { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.crumbs { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.stack { display: grid; gap: 16px; }

dialog { border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: min(460px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20, 10, 4, .45); }
dialog h3 { margin: 0 0 6px; font-size: 18px; }
dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

.toast { position: fixed; inset-inline: 0; bottom: 20px; margin: auto; width: max-content; max-width: calc(100vw - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; z-index: 20; box-shadow: var(--shadow); }
.toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 1080px) { .app { grid-template-columns: 200px minmax(280px, 360px) minmax(0, 1fr); } }
@media (max-width: 820px) {
  .app { display: flex; flex-direction: column; height: auto; min-height: calc(100vh - 57px); }
  nav.views { flex-direction: row; overflow-x: auto; border-inline-end: 0; border-bottom: 1px solid var(--line); padding: 8px; scrollbar-width: none; }
  .view { width: auto; white-space: nowrap; }
  .views .help, .views .scope, .views .section { display: none; }
  section.list { border-inline-end: 0; }
  ul.items { overflow: visible; }
  .app.showing-detail section.list, .app.showing-detail nav.views { display: none; }
  .app:not(.showing-detail) section.detail { display: none; }
  .back { display: inline-flex; margin-bottom: 12px; }
  .detail-inner { padding: 16px; }
  .who, .brand small { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/icon.png" alt=""><span>Report Me</span><small data-t="dashboard">Dashboard</small></div>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <button class="btn small ghost" id="lang" type="button" lang="ar">العربية</button>
  <button class="btn small" id="signout" type="button" data-t="signOut" hidden>Sign out</button>
</header>

<main id="signin" class="center" hidden>
  <form class="card" id="signin-form" autocomplete="on">
    <h1 data-t="signInTitle">Dashboard sign in</h1>
    <p class="muted" data-t="signInBody">We'll email you a 6-digit code.</p>
    <div class="error" id="signin-error" role="alert" hidden></div>
    <div class="field" id="email-field">
      <label for="email" data-t="email">Email</label>
      <input class="input" id="email" type="email" autocomplete="email" required>
    </div>
    <div class="field" id="code-field" hidden>
      <label for="code" data-t="code">6-digit code</label>
      <input class="input code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
      <button class="btn small ghost" id="change-email" type="button" data-t="changeEmail">Use a different email</button>
    </div>
    <button class="btn primary" id="signin-submit" type="submit" style="width:100%" data-t="sendCode">Send code</button>
  </form>
</main>

<main id="noaccess" class="center" hidden>
  <div class="card">
    <h1 data-t="noAccessTitle">No dashboard access</h1>
    <p class="muted" data-t="noAccessBody">This account isn't part of the central team or of a government entity.</p>
    <p class="muted" style="font-size:13px"><span data-t="accountId">Account ID</span>: <code id="noaccess-id"></code></p>
  </div>
</main>

<div class="app" id="app" hidden>
  <nav class="views" id="views" aria-label="Lists"></nav>
  <section class="list" aria-label="Items">
    <div class="filters" id="filters"></div>
    <ul class="items" id="items" role="listbox"></ul>
  </section>
  <section class="detail" id="detail" aria-live="polite"></section>
</div>

<dialog id="dialog">
  <form method="dialog">
    <h3 id="dialog-title"></h3>
    <p id="dialog-body"></p>
    <div id="dialog-extra"></div>
    <div class="field">
      <label for="dialog-note" id="dialog-note-label"></label>
      <textarea class="input" id="dialog-note" maxlength="500"></textarea>
    </div>
    <div class="row">
      <button class="btn" value="cancel" data-t="cancel">Cancel</button>
      <button class="btn primary" value="ok" id="dialog-ok"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

let lang = readPref("lang") || "ar";
const t = (key, ...args) => { const v = T[lang][key] ?? T.en[key] ?? key; return typeof v === "function" ? v(...args) : v; };
function readPref(key) { try { return localStorage.getItem(`rm-admin-${key}`); } catch { return null; } }
function writePref(key, value) { try { localStorage.setItem(`rm-admin-${key}`, value); } catch { /* private mode */ } }

function applyLanguage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  const toggle = $("lang");
  toggle.textContent = lang === "ar" ? "English" : "العربية";
  toggle.lang = lang === "ar" ? "en" : "ar";
}

// ---------------------------------------------------------------- Helpers (user text only via textContent)
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = Boolean(v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const $ = (id) => document.getElementById(id);
const locale = () => (lang === "ar" ? "ar-SY" : "en-GB");
const nm = (o) => (o ? (lang === "ar" ? o.name_ar : o.name_en) : "");
function fmtDistance(m) {
  if (m == null) return "";
  const n = new Intl.NumberFormat(locale(), { maximumFractionDigits: m >= 1000 ? 1 : 0 });
  return m >= 1000 ? `${n.format(m / 1000)} km` : `${n.format(m)} m`;
}
const fmtDate = (iso) => new Intl.DateTimeFormat(locale(), { dateStyle: "medium", timeStyle: "short" }).format(new Date(iso));
function timeAgo(iso) {
  const rtf = new Intl.RelativeTimeFormat(lang === "ar" ? "ar" : "en", { numeric: "auto" });
  const s = (new Date(iso) - Date.now()) / 1000;
  for (const [unit, size] of [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]]) {
    if (Math.abs(s) >= size) return rtf.format(Math.round(s / size), unit);
  }
  return rtf.format(Math.round(s), "second");
}
const isOverdue = (task) => task.due_at && new Date(task.due_at) < new Date() && OPEN.includes(task.status);

let toastTimer;
function toast(message, bad = false) {
  const el = $("toast");
  el.textContent = message;
  el.className = bad ? "toast bad" : "toast";
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, bad ? 6000 : 2600);
}
function errorText(error) {
  const msg = `${error?.message || ""} ${error?.code || ""}`;
  const map = [["forbidden", "e_forbidden"], ["42501", "e_forbidden"], ["already_central", "e_central"], ["no_entity", "e_no_entity"],
    ["same_sector", "e_same_sector"], ["user_not_found", "e_user"], ["invalid_deadline", "e_deadline"], ["duplicate_of_required", "e_dup"],
    ["cannot_ban_staff", "e_staff"], ["fix_photo_required", "fixPhotoMissing"], ["Failed to fetch", "e_network"], ["NetworkError", "e_network"]];
  for (const [needle, key] of map) if (msg.includes(needle)) return t(key);
  return t("e_generic");
}

const isAdmin = () => state.me.role === "admin";
const myEntityIds = () => state.me.memberships.map((m) => m.entity_id);

function isUnder(pcode, ancestor) {
  for (let p = pcode; p; p = state.areas.get(p)?.parent_pcode) if (p === ancestor) return true;
  return false;
}

      { id: "mine_verified", kind: "tasks", icon: "✅", key: "v_verified", filter: (q) => q.eq("status", "verified").in("entity_id", mine) },
      { id: "mine_progress", kind: "tasks", icon: "🛠️", key: "v_progress", filter: (q) => q.eq("status", "in_progress").in("entity_id", mine) },
      { id: "overdue", kind: "tasks", icon: "⏰", key: "v_overdue", alarm: true, filter: (q) => q.in("status", OPEN).lt("due_at", new Date().toISOString()).order("due_at", { ascending: true }) },

    list.push(
      { section: "sec_central" },
      { id: "review", kind: "reports", icon: "⏳", key: "v_review", hot: true, filter: (q) => q.eq("needs_review", true).order("created_at", { ascending: true }) },
      { id: "central", kind: "tasks", icon: "🏛️", key: "v_central", hot: true, filter: (q) => q.is("entity_id", null).in("status", OPEN) },
      { id: "open", kind: "tasks", icon: "📋", key: "v_open", filter: (q) => q.in("status", OPEN) },
    );

    list.push(
      { id: "flagged", kind: "reports", icon: "🚩", key: "v_flagged", filter: (q) => q.gt("flag_count", 0).not("status", "in", "(rejected,duplicate)") },

    );
  }

    list.push({ section: "sec_setup" }, { id: "entities", kind: "config", icon: "🏢", key: isAdmin() ? "v_entities" : "v_offices" });

      { id: "categories", kind: "config", icon: "🏷️", key: "v_categories" },
      { id: "sectors", kind: "config", icon: "🧩", key: "v_sectors" },
      { id: "settings", kind: "config", icon: "⚙️", key: "v_settings" },

  }
  return list;
}
const listViews = () => views().filter((v) => v.id);
const currentView = () => listViews().find((v) => v.id === state.view) || listViews()[0];

// ---------------------------------------------------------------- Auth
let pendingEmail = "";
async function start() {
  applyLanguage();
  const { data } = await supabase.auth.getSession();
  await onSession(data.session);
  supabase.auth.onAuthStateChange((event, session) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT") onSession(session); });
  window.addEventListener("hashchange", openFromHash);
}

async function onSession(session) {
  state.user = session?.user ?? null;
  $("signout").hidden = !state.user;
  $("who").textContent = state.user?.email ?? "";
  for (const id of ["signin", "noaccess", "app"]) $(id).hidden = true;
  if (!state.user) { $("signin").hidden = false; setSignInStep(pendingEmail ? "code" : "email"); return; }

  const { data: me } = await supabase.rpc("dashboard_me");
  state.me = { role: me?.role ?? null, memberships: me?.memberships ?? [] };
  if (!isStaff() && !state.me.memberships.length) {
    $("noaccess-id").textContent = state.user.id;
    $("noaccess").hidden = false;
    return;
  }
  await loadReference();
  if (!listViews().some((v) => v.id === state.view)) state.view = listViews()[0].id;
  $("app").hidden = false;
  await showView();
  openFromHash();
}

function setSignInStep(step) {
  $("email-field").hidden = step !== "email";
  $("code-field").hidden = step !== "code";
  $("signin-submit").textContent = step === "email" ? t("sendCode") : t("signIn");
  $("signin-submit").dataset.t = step === "email" ? "sendCode" : "signIn";
  (step === "email" ? $("email") : $("code")).focus();
}
function signInError(message) { $("signin-error").textContent = message || ""; $("signin-error").hidden = !message; }

$("signin-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  signInError("");
  const button = $("signin-submit");
  button.disabled = true;
  try {
    if (!pendingEmail) {
      const email = $("email").value.trim();
      const { error } = await supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
      if (error) { signInError(/signups not allowed|not found|422/i.test(error.message) ? t("noAccount") : errorText(error)); return; }
      pendingEmail = email;
      setSignInStep("code");
      toast(t("codeSent"));
    } else {
      const { error } = await supabase.auth.verifyOtp({ email: pendingEmail, token: $("code").value.trim(), type: "email" });
      if (error) { signInError(t("badCode")); return; }
      pendingEmail = "";
      $("code").value = "";
    }
  } finally { button.disabled = false; }
});
$("change-email").addEventListener("click", () => { pendingEmail = ""; signInError(""); setSignInStep("email"); });
$("signout").addEventListener("click", () => supabase.auth.signOut());
$("lang").addEventListener("click", async () => {
  lang = lang === "ar" ? "en" : "ar";
  writePref("lang", lang);
  applyLanguage();
  if (!$("signin").hidden) setSignInStep(pendingEmail ? "code" : "email");
  if (!$("app").hidden) { renderViews(); renderFilters(); renderList(); renderDetail(); }
});

// ---------------------------------------------------------------- Reference data
async function loadReference() {
  const [areas, categories, sectors, catSectors, entities] = await Promise.all([
    supabase.from("admin_areas").select("pcode, level, parent_pcode, name_en, name_ar").order("pcode"),
    supabase.from("categories").select("id, name_en, name_ar, icon, color, default_severity, is_active, sort_order, ai_labels").order("sort_order"),
    supabase.from("sectors").select("*").order("sort_order"),
    supabase.from("category_sectors").select("category_id, sector_id"),
    supabase.from("entities").select("id, sector_id, area_pcode, name_en, name_ar, is_active"),
  ]);
  state.areas = new Map((areas.data || []).map((a) => [a.pcode, a]));
  state.categories = new Map((categories.data || []).map((c) => [c.id, c]));
  state.sectors = new Map((sectors.data || []).map((s) => [s.id, s]));
  state.catSectors = new Map();
  for (const row of catSectors.data || []) state.catSectors.set(row.category_id, [...(state.catSectors.get(row.category_id) || []), row.sector_id]);
  state.entities = new Map((entities.data || []).map((e) => [e.id, e]));
}

// ---------------------------------------------------------------- Views and lists
function renderViews() {
  const scope = isStaff() && !state.me.memberships.length
    ? h("div", { class: "scope" }, h("strong", {}, t("scopeCentral")), state.me.role)
    : h("div", { class: "scope" }, state.me.memberships.map((m) => h("strong", {}, `${state.sectors.get(m.sector_id)?.icon ?? ""} ${nm(m)}`)));
  $("views").replaceChildren(scope, ...views().map((v) => {
    if (v.section) return h("div", { class: "section" }, t(v.section));
    const count = state.counts[v.id];
    const cls = v.alarm && count > 0 ? "count alarm" : `count${v.hot && count > 0 ? " hot" : ""}`;
    return h("button", { class: "view", type: "button", "aria-current": String(v.id === state.view), onclick: () => switchView(v.id) },
      h("span", { "aria-hidden": "true" }, v.icon), t(v.key), count != null ? h("span", { class: cls }, count) : null);
  }), h("p", { class: "help" }, t("help")));
}

async function switchView(id) {
  state.view = id;
  writePref("view", id);
  state.selectedId = null;
  $("app").classList.remove("showing-detail");
  await showView();
}

async function showView() {
  renderViews();
  renderFilters();
  if (currentView().kind === "config") await loadConfig();
  else await Promise.all([loadItems(), loadCounts()]);
}

function renderFilters() {
  const v = currentView();
  const box = $("filters");
  if (v.kind === "config") { box.replaceChildren(...configFilters(v.id)); return; }
  let timer;
  const search = h("input", { class: "input wide", type: "search", placeholder: t("search"), value: state.filter.search,
    oninput: (e) => { clearTimeout(timer); timer = setTimeout(() => { state.filter.search = e.target.value.trim(); loadItems(); }, 300); } });
  const sel = (key, allKey, options) => {
    const s = h("select", { class: "input", onchange: (e) => { state.filter[key] = e.target.value; loadItems(); } },
      h("option", { value: "" }, t(allKey)), options);
    s.value = state.filter[key];
    return s;
  };
  const govs = [...state.areas.values()].filter((a) => a.level === 1).sort((a, b) => nm(a).localeCompare(nm(b), lang));
  box.replaceChildren(...[
    search,
    sel("governorate", "allGovernorates", govs.map((a) => h("option", { value: a.pcode }, nm(a)))),
    sel("category", "allCategories", [...state.categories.values()].map((c) => h("option", { value: c.id }, `${c.icon} ${nm(c)}`))),
    isStaff() ? sel("sector", "allSectors", [...state.sectors.values()].map((s) => h("option", { value: s.id }, `${s.icon} ${nm(s)}`))) : null,
  ].filter(Boolean));
}

function applyFilters(query, kind) {
  const f = state.filter;
  if (f.category) query = query.eq("category_id", f.category);
  if (f.governorate) query = query.eq("governorate_pcode", f.governorate);
  if (f.sector && kind === "tasks") query = query.eq("sector_id", f.sector);
  if (f.search) { const s = f.search.replace(/[%,()]/g, " "); query = query.or(`address.ilike.%${s}%,description.ilike.%${s}%`); }
  return query;
}

let loadToken = 0;
async function loadItems() {
  const v = currentView();
  const token = ++loadToken;
  const table = v.kind === "tasks" ? "staff_tasks" : "staff_reports";
  const { data, error } = await applyFilters(v.filter(supabase.from(table).select("*")), v.kind).limit(200);
  if (token !== loadToken) return;
  if (error) { toast(errorText(error), true); return; }
  state.items = data || [];
  if (!state.items.some((x) => x.id === state.selectedId)) state.selectedId = null;
  renderList();
  renderDetail();
}

async function loadCounts() {
  const counted = listViews().filter((v) => v.kind !== "config" && v.count !== false);
  const results = await Promise.all(counted.map(async (v) => {
    const table = v.kind === "tasks" ? "staff_tasks" : "staff_reports";
    const { count } = await v.filter(supabase.from(table).select("id", { count: "exact", head: true }));
    return [v.id, count ?? 0];
  }));
  state.counts = Object.fromEntries(results);
  renderViews();
}

const refresh = () => (currentView().kind === "config" ? loadConfig() : Promise.all([loadItems(), loadCounts()]));

// #task=<id> (emails) and #report=<id>
async function openFromHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  const taskId = params.get("task");
  const reportId = params.get("report");
  if ($("app").hidden || (!taskId && !reportId)) return;
  const viewId = taskId ? (listViews().find((v) => v.id === "all" || v.id === "open")?.id) : (isStaff() ? "reports" : null);
  if (!viewId) return;
  const table = taskId ? "staff_tasks" : "staff_reports";
  const { data } = await supabase.from(table).select("*").eq("id", taskId || reportId).maybeSingle();
  if (!data) return;
  if (state.view !== viewId) { state.view = viewId; renderViews(); renderFilters(); }
  state.items = [data, ...state.items.filter((x) => x.id !== data.id)];
  renderList();
  select(data.id);
}

  if (!x) { $("detail").replaceChildren(h("div", { class: "empty" }, h("div", { class: "big" }, "🗂️"), t("pick"))); return; }
  if (v.kind === "tasks") renderTaskDetail(x); else renderReportDetail(x);

function ask({ title, body, okText, okClass = "primary", noteLabel = t("noteLabel"), extra = null }) {
  const dialog = $("dialog");
  $("dialog-title").textContent = title;
  $("dialog-body").textContent = body;
  $("dialog-note-label").textContent = noteLabel;
  $("dialog-note").value = "";
  $("dialog-extra").replaceChildren(...(extra ? [extra] : []));
  $("dialog-ok").textContent = okText;
  $("dialog-ok").className = `btn ${okClass}`;
  return new Promise((resolve) => {
    dialog.addEventListener("close", () => resolve(dialog.returnValue === "ok"
      ? { note: $("dialog-note").value.trim() || null, value: extra?.querySelector("select, input")?.value ?? null } : null), { once: true });
    dialog.showModal();
    (extra?.querySelector("select, input") ?? $("dialog-note")).focus();
  });
}

async function run(rpc, args, message = t("done")) {
  const { data, error } = await supabase.rpc(rpc, args);
  if (error) { toast(errorText(error), true); return null; }
  toast(typeof message === "function" ? message(data) : message);
  const index = state.items.findIndex((x) => x.id === state.selectedId);
  await loadReference();
  await refresh();
  if (!state.items.some((x) => x.id === state.selectedId) && state.items.length) select(state.items[Math.min(Math.max(index, 0), state.items.length - 1)].id);
  else renderDetail();
  return data ?? true;
}

async function changeTask(task, status, key) {

    okText: t(key), okClass: status === "rejected" ? "bad" : "primary", extra: photo });
  if (!answer) return;
  let path = null;
  if (status === "resolved") {
    path = await uploadFixPhoto(photo, task.report_id, task.id);

  }
  await run("set_task_status", { p_task_id: task.id, p_status: status, p_note: answer.note, p_photo_path: path });
}

// Proof of the fix: a required photo, resized to a JPEG in the browser (this also drops its location data),
// stored as report-photos/<report id>/fixes/<task id>/<random>.jpg.
function fixPhotoField() {
  return h("div", { class: "field" }, h("label", {}, t("fixPhoto")),
    h("input", { class: "input", type: "file", accept: "image/*", capture: "environment" }));
}

async function uploadFixPhoto(field, reportId, taskId) {
  const file = field.querySelector("input").files?.[0];
  if (!file) { toast(t("fixPhotoMissing"), true); return null; }
  toast(t("uploading"));
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.8));
  const path = `${reportId}/fixes/${taskId}/${crypto.randomUUID()}.jpg`;
  const { error } = await supabase.storage.from("report-photos").upload(path, blob, { contentType: "image/jpeg" });
  if (error) { toast(errorText(error), true); return null; }
  return path;
}

    const q = areaSearch.value.trim().toLowerCase();

function categoryForm(c) {
  const isNew = !c;
  const id = textInput(c?.id, { dir: "ltr", disabled: !isNew, pattern: "[a-z_]+" });
  const nameEn = textInput(c?.name_en);
  const nameAr = textInput(c?.name_ar, { dir: "rtl" });
  const icon = textInput(c?.icon ?? "📍");
  const color = h("input", { class: "input", type: "color", value: c?.color ?? "#E8590C" });
  const severity = h("select", { class: "input" }, ["low", "medium", "high"].map((s) => h("option", { value: s }, t(`sev_${s}`))));
  severity.value = c?.default_severity ?? "medium";
  const order = textInput(String(c?.sort_order ?? 200), { type: "number" });
  const active = h("input", { type: "checkbox", id: "c-active", checked: c ? c.is_active : true });
  const current = new Set(state.catSectors.get(c?.id) || []);
  const checks = [...state.sectors.values()].map((s) => h("label", {}, h("input", { type: "checkbox", value: s.id, checked: current.has(s.id) }), `${s.icon} ${nm(s)}`));
  const labels = h("textarea", { class: "input", dir: "ltr" }, (c?.ai_labels || []).join(", "));
  return h("div", { class: "stack" },
    h("h2", { style: "margin:0" }, isNew ? t("newCategory") : `${c.icon} ${nm(c)}`),
    h("div", { class: "panel" },
      h("div", { class: "form-grid" }, field(t("catId"), id), field(t("icon"), icon), field(t("nameEn"), nameEn), field(t("nameAr"), nameAr),
        field(t("color"), color), field(t("severity"), severity), field(t("sortOrder"), order)),
      h("label", { class: "switch", for: "c-active" }, active, t("active"))),
    h("div", { class: "panel" }, h("h3", {}, t("catSectors")), h("div", { class: "checks" }, checks)),
    h("div", { class: "panel" }, field(t("aiLabels"), labels, t("aiHint"))),
    h("div", {}, saveButton(async () => {
      const sectors = checks.map((l) => l.querySelector("input")).filter((i) => i.checked).map((i) => i.value);
      const { error } = await supabase.rpc("save_category", { p_id: id.value, p_name_en: nameEn.value, p_name_ar: nameAr.value, p_icon: icon.value,
        p_color: color.value.toUpperCase(), p_default_severity: severity.value, p_is_active: active.checked, p_sort_order: Number(order.value),
        p_ai_labels: labels.value.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean), p_sectors: sectors });
      if (error) { toast(errorText(error), true); return; }
      toast(t("saved"));
      await loadReference();
      state.selectedId = id.value.trim().toLowerCase();
      renderConfigList(); renderConfigDetail();
    })));
}

function sectorForm(s) {
  const isNew = !s;
  const id = textInput(s?.id, { dir: "ltr", disabled: !isNew });
  const nameEn = textInput(s?.name_en);
  const nameAr = textInput(s?.name_ar, { dir: "rtl" });
  const icon = textInput(s?.icon ?? "🏛️");
  const order = textInput(String(s?.sort_order ?? 100), { type: "number" });
  const active = h("input", { type: "checkbox", id: "s-active", checked: s ? s.is_active : true });
  return h("div", { class: "stack" },
    h("h2", { style: "margin:0" }, isNew ? t("newSector") : `${s.icon} ${nm(s)}`),
    h("div", { class: "panel" },
      h("div", { class: "form-grid" }, field(t("sectorId"), id), field(t("icon"), icon), field(t("nameEn"), nameEn), field(t("nameAr"), nameAr), field(t("sortOrder"), order)),
      h("label", { class: "switch", for: "s-active", style: "margin-bottom:14px" }, active, t("active")),
      saveButton(async () => {
        const { error } = await supabase.rpc("save_sector", { p_id: id.value, p_name_en: nameEn.value, p_name_ar: nameAr.value, p_icon: icon.value,
          p_is_active: active.checked, p_sort_order: Number(order.value) });
        if (error) { toast(errorText(error), true); return; }
        toast(t("saved"));
        await loadReference();
        state.selectedId = id.value.trim().toLowerCase();
        renderConfigList(); renderConfigDetail();
      })));
}

function settingsForm() {
  const s = state.config.settings || {};
  const restrict = h("input", { type: "checkbox", id: "st-restrict", checked: s.restrict_to_service_area ?? true });
  const requireLocation = h("input", { type: "checkbox", id: "st-location", checked: s.require_device_location ?? true });
  const subdistricts = [...state.areas.values()].filter((a) => a.level === 3)
    .map((a) => ({ pcode: a.pcode, label: [state.areas.get(state.areas.get(a.parent_pcode)?.parent_pcode), state.areas.get(a.parent_pcode), a].map(nm).join(" › ") }))
    .sort((a, b) => a.label.localeCompare(b.label, lang));
  const testArea = h("select", { class: "input" },
    h("option", { value: "" }, t("testAreaNone")),
    subdistricts.map((a) => h("option", { value: a.pcode }, a.label)));
  testArea.value = s.test_area_pcode ?? "";
  const radius = textInput(String(s.duplicate_radius_m ?? 500), { type: "number", min: "50", max: "5000" });
  const defSector = h("select", { class: "input" }, [...state.sectors.values()].map((x) => h("option", { value: x.id }, `${x.icon} ${nm(x)}`)));
  defSector.value = s.default_sector_id ?? "municipal";
  const days = (interval) => parseInt(String(interval).match(/(\d+) day/)?.[1] ?? "0", 10);
  const rows = state.config.rules.map((rule) => {
    const verify = textInput(String(days(rule.verify_within)), { type: "number", min: "1", "aria-label": t("verifyDays") });
    const fix = textInput(String(days(rule.fix_within)), { type: "number", min: "1", "aria-label": t("fixDays") });
    return h("tr", {}, h("td", {}, t(`lv${rule.level}`)), h("td", {}, verify), h("td", {}, fix), h("td", {},
      h("button", { class: "btn small", type: "button", onclick: async () => {
        const { error } = await supabase.rpc("save_escalation_rule", { p_level: rule.level, p_verify_days: Number(verify.value), p_fix_days: Number(fix.value) });
        toast(error ? errorText(error) : t("saved"), Boolean(error));
      } }, t("save"))));
  });
  return h("div", { class: "stack" },
    h("h2", { style: "margin:0" }, t("settingsTitle")),
    h("div", { class: "panel" },
      h("label", { class: "switch", for: "st-restrict" }, restrict, t("restrict")),
      h("p", { class: "muted", style: "margin:6px 0 14px;font-size:14px" }, t("restrictHint")),
      h("label", { class: "switch", for: "st-location" }, requireLocation, t("requireLocation")),
      h("p", { class: "muted", style: "margin:6px 0 14px;font-size:14px" }, t("requireLocationHint")),
      field(t("testArea"), testArea),
      h("p", { class: "muted", style: "margin:6px 0 14px;font-size:14px" }, t("testAreaHint")),
      h("div", { class: "form-grid" }, field(t("dupRadius"), radius), field(t("defaultSector"), defSector)),
      saveButton(async () => {
        const { error } = await supabase.rpc("save_settings", { p_restrict: restrict.checked, p_duplicate_radius_m: Number(radius.value), p_default_sector: defSector.value, p_require_device_location: requireLocation.checked, p_test_area: testArea.value || null });
        toast(error ? errorText(error) : t("saved"), Boolean(error));
      })),
    h("div", { class: "panel" }, h("h3", {}, t("deadlines")),
      h("table", { class: "rules" }, h("thead", {}, h("tr", {}, h("th", {}, t("level")), h("th", {}, t("verifyDays")), h("th", {}, t("fixDays")), h("th", {}))), h("tbody", {}, rows))),
    h("div", { class: "panel" }, h("h3", {}, t("reroute")), h("p", { class: "muted", style: "margin:0 0 10px;font-size:14px" }, t("rerouteHint")),
      h("button", { class: "btn", type: "button", onclick: async () => {
        const { data, error } = await supabase.rpc("reroute_open_tasks");
        toast(error ? errorText(error) : t("rerouted", data ?? 0), Boolean(error));
      } }, "↻ ", t("reroute"))));
}

// ---------------------------------------------------------------- Keys and refresh
document.addEventListener("keydown", (e) => {
  const v = currentView();
  if ($("app").hidden || v.kind === "config" || $("dialog").open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
  const index = state.items.findIndex((x) => x.id === state.selectedId);
  const x = state.items[index];
  const go = (n) => { if (n) { select(n.id); document.querySelector(`.item[data-id="${n.id}"]`)?.scrollIntoView({ block: "nearest" }); } };
  if (e.key === "j" || e.key === "ArrowDown") { go(state.items[index + 1] || state.items[0]); e.preventDefault(); }
  else if (e.key === "k" || e.key === "ArrowUp") { go(state.items[index - 1] || state.items[state.items.length - 1]); e.preventDefault(); }
  else if (!x) return;
  else if (v.kind === "tasks" && e.key === "a" && x.status === "new") changeTask(x, "verified", "verify");
  else if (v.kind === "tasks" && e.key === "r" && OPEN.includes(x.status)) changeTask(x, "rejected", "reject");
  else if (v.kind === "tasks" && e.key === "e" && OPEN.includes(x.status) && x.entity_id) escalate(x);
  else if (v.kind === "reports" && e.key === "a" && x.needs_review) run("review_report", { p_report_id: x.id, p_approve: true, p_note: null });
  else if (v.kind === "reports" && e.key === "r" && !["rejected", "duplicate"].includes(x.status)) rejectReport(x);
});

setInterval(() => { if (!$("app").hidden && !document.hidden && currentView().kind !== "config") loadCounts(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").hidden) refresh(); });

start();
</script>
</body>
